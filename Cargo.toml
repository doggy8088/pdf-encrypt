[package]
name = "pdf-encrypt"
version = "0.1.1"
edition = "2021"
authors = ["Will 保哥 <doggy.huang@gmail.com>"]
description = "A Rust command line utility that encrypts and decrypts PDF documents."
license = "MIT"
repository = "https://github.com/doggy8088/pdf-encrypt"
homepage = "https://github.com/doggy8088/pdf-encrypt"
readme = "README.md"
keywords = ["pdf", "encryption", "decrypt", "cli"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
lopdf = "0.40"
clap = { version = "4.3", features = ["derive"] }
anyhow = "1.0"
getrandom = { version = "0.4", features = ["std"] }

[dev-dependencies]
tempfile = "3.8"

[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.deb]
section = "utils"
priority = "optional"
assets = [
    ["target/release/pdf-encrypt", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/pdf-encrypt/README.md", "644"],
    ["LICENSE", "usr/share/doc/pdf-encrypt/LICENSE", "644"],
]
extended-description = """\
pdf-encrypt is a command line tool that encrypts, decrypts, and re-encrypts PDF
files with configurable passwords, viewer permissions, metadata, and PDF standard
security handler algorithms.
"""

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/pdf-encrypt", dest = "/usr/bin/pdf-encrypt", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/pdf-encrypt/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/pdf-encrypt/LICENSE", mode = "644", doc = true },
]

[package.metadata.wix]
upgrade-guid = "C09D09C1-74C3-48CB-94EB-8520066240E5"
path-guid = "24DFA77D-CFCE-42D5-86E0-C7A68428A878"
license = false
eula = false
