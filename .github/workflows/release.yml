#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "contents": "write"

# This task will run whenever main contains a Cargo package version that does
# not have a matching GitHub Release yet, or whenever you push a git tag
# that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish or republish, with or without leading v. Leave empty to use Cargo.toml package.version."
        required: false
        type: string
      republish_existing:
        description: "When the GitHub Release already exists, rebuild artifacts and upload them with --clobber instead of skipping."
        required: false
        default: true
        type: boolean
      verify_trusted_publishing:
        description: "Only verify crates.io Trusted Publishing authentication; do not publish or rebuild release assets."
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches:
      - main
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ steps.version.outputs.tag }}
      tag-flag: ${{ steps.version.outputs.tag != '' && format('--tag={0}', steps.version.outputs.tag) || '' }}
      version: ${{ steps.version.outputs.version }}
      publishing: ${{ steps.version.outputs.publishing }}
      republish-existing: ${{ steps.version.outputs.republish-existing }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - id: version
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version || '' }}
          DISPATCH_REPUBLISH_EXISTING: ${{ github.event.inputs.republish_existing || 'false' }}
          VERIFY_TRUSTED_PUBLISHING: ${{ inputs.verify_trusted_publishing || false }}
        run: |
          set -euo pipefail

          resolve_package_version() {
            awk '
              /^\[package\]/ { in_package = 1; next }
              /^\[/ { if (in_package) exit }
              in_package && /^version[[:space:]]*=/ {
                value = $0
                sub(/^[^=]*=[[:space:]]*"/, "", value)
                sub(/".*$/, "", value)
                print value
                exit
              }
            ' Cargo.toml
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo "tag="
              echo "version="
              echo "publishing=false"
              echo "republish-existing=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            {
              echo "tag=$tag"
              echo "version=$version"
              echo "publishing=true"
              echo "republish-existing=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          package_version="$(resolve_package_version)"

          if [ -z "$package_version" ]; then
            echo "Unable to resolve package.version from Cargo.toml" >&2
            exit 1
          fi

          version="$package_version"
          republish_existing=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${DISPATCH_VERSION:-$package_version}"
            version="${version#v}"

            if [ "$version" != "$package_version" ]; then
              echo "Requested version $version does not match Cargo.toml package.version $package_version." >&2
              echo "Run this workflow from a ref whose Cargo.toml has the version you want to republish." >&2
              exit 1
            fi
          fi

          tag="v$version"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$VERIFY_TRUSTED_PUBLISHING" = "true" ]; then
            {
              echo "tag=$tag"
              echo "version=$version"
              echo "publishing=false"
              echo "republish-existing=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$DISPATCH_REPUBLISH_EXISTING" = "true" ]; then
              echo "::notice::Release $tag already exists; rebuilding artifacts and uploading with --clobber."
              publishing=true
              republish_existing=true
            else
              echo "::notice::Release $tag already exists; skipping publish."
              publishing=false
            fi
          else
            publishing=true
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "publishing=$publishing"
            echo "republish-existing=$republish_existing"
          } >> "$GITHUB_OUTPUT"
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v6
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          if [ "${{ steps.version.outputs.publishing }}" = "true" ] && [ "${{ steps.version.outputs.republish-existing }}" != "true" ]; then
            dist host --steps=create --tag="${{ steps.version.outputs.tag }}" --output-format=json > plan-dist-manifest.json
          else
            dist plan --output-format=json > plan-dist-manifest.json
          fi
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ !inputs.verify_trusted_publishing && fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        shell: bash
        run: |
          extra_dist_args=()
          case " ${{ join(matrix.targets, ' ') }} " in
            *" aarch64-pc-windows-msvc "*)
              # cargo-dist builds Windows ARM64 with cargo-xwin in a Linux container.
              # WiX v3 is Windows-only, so publish the ARM64 zip but skip MSI there.
              extra_dist_args+=(--installer=shell --installer=powershell --installer=homebrew)
              ;;
          esac

          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} "${extra_dist_args[@]}" > dist-manifest.json
          echo "dist ran successfully"

          raw_paths_file="$RUNNER_TEMP/raw-executable-upload-files.txt"
          : > "$raw_paths_file"

          for target in ${{ join(matrix.targets, ' ') }}; do
            executable_name="pdf-encrypt"
            asset_name="pdf-encrypt-$target"

            case "$target" in
              *windows-msvc)
                executable_name="pdf-encrypt.exe"
                asset_name="$asset_name.exe"
                ;;
            esac

            output_path="target/distrib/$asset_name"
            temp_output="$RUNNER_TEMP/$asset_name"
            rm -f "$temp_output"

            source_path="$(
              find target \
                -type f \
                -path "*/$target/release/$executable_name" \
                -print \
                | head -n 1
            )"

            if [ ! -f "$source_path" ]; then
              tarball="target/distrib/pdf-encrypt-$target.tar.xz"
              zipball="target/distrib/pdf-encrypt-$target.zip"

              if [ -f "$tarball" ]; then
                member="$(
                  tar -tf "$tarball" \
                    | grep -E "(^|/)$executable_name\$" \
                    | head -n 1 \
                    || true
                )"

                if [ -n "$member" ]; then
                  tar -xOf "$tarball" "$member" > "$temp_output"
                fi
              elif [ -f "$zipball" ]; then
                if command -v unzip >/dev/null 2>&1; then
                  member="$(
                    unzip -Z1 "$zipball" \
                      | grep -E "(^|/)$executable_name\$" \
                      | head -n 1 \
                      || true
                  )"

                  if [ -n "$member" ]; then
                    unzip -p "$zipball" "$member" > "$temp_output"
                  fi
                elif command -v python3 >/dev/null 2>&1; then
                  python3 -c 'import sys, zipfile; zipball, executable_name, output_path = sys.argv[1:]; archive = zipfile.ZipFile(zipball); members = [name for name in archive.namelist() if name.endswith("/" + executable_name) or name == executable_name]; open(output_path, "wb").write(archive.read(members[0])) if members else None' "$zipball" "$executable_name" "$temp_output"
                fi
              fi
            else
              cp "$source_path" "$temp_output"
            fi

            if [ ! -s "$temp_output" ]; then
              echo "Expected raw executable was not found for target $target" >&2
              exit 1
            fi

            rm -rf "$output_path"
            mv "$temp_output" "$output_path"

            case "$target" in
              *windows-msvc) ;;
              *) chmod +x "$output_path" ;;
            esac

            (
              cd target/distrib
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$asset_name" > "$asset_name.sha256"
              else
                shasum -a 256 "$asset_name" > "$asset_name.sha256"
              fi
            )

            {
              echo "$output_path"
              echo "$output_path.sha256"
            } >> "$raw_paths_file"
          done

          echo "RAW_EXECUTABLE_UPLOAD_FILES=$raw_paths_file" >> "$GITHUB_ENV"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          if [ -n "${RAW_EXECUTABLE_UPLOAD_FILES:-}" ] && [ -f "$RAW_EXECUTABLE_UPLOAD_FILES" ]; then
            cat "$RAW_EXECUTABLE_UPLOAD_FILES" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          host_steps=(--steps=upload)
          if [ "${{ needs.plan.outputs.republish-existing }}" != "true" ]; then
            host_steps+=(--steps=release)
          fi

          dist host ${{ needs.plan.outputs.tag-flag }} "${host_steps[@]}" --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v6
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
          RELEASE_TAG: "${{ needs.plan.outputs.tag }}"
          REPUBLISH_EXISTING: "${{ needs.plan.outputs.republish-existing }}"
        run: |
          if [ "$REPUBLISH_EXISTING" = "true" ] && gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
            exit 0
          fi

          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  linux-packages:
    name: Linux packages (.deb, .rpm)
    needs:
      - plan
      - host
    if: ${{ always() && needs.host.result == 'success' && needs.plan.outputs.publishing == 'true' }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Install packaging tools
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked
      - name: Build release binary
        run: cargo build --locked --release
      - name: Build Debian package
        run: |
          mkdir -p target/distrib
          cargo deb --no-build --output target/distrib/pdf-encrypt_${{ needs.plan.outputs.version }}_amd64.deb
      - name: Build RPM package
        run: cargo generate-rpm --output target/distrib/pdf-encrypt-${{ needs.plan.outputs.version }}-1.x86_64.rpm
      - name: Generate package checksums
        shell: bash
        run: |
          cd target/distrib
          sha256sum *.deb *.rpm > pdf-encrypt-linux-packages.sha256
      - name: Upload packages to GitHub Release
        run: gh release upload "${{ needs.plan.outputs.tag }}" target/distrib/*.deb target/distrib/*.rpm target/distrib/pdf-encrypt-linux-packages.sha256 --clobber

  macos-pkg:
    name: macOS pkg (${{ matrix.target }})
    needs:
      - plan
      - host
    if: ${{ always() && needs.host.result == 'success' && needs.plan.outputs.publishing == 'true' }}
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            suffix: x86_64-apple-darwin
          - target: aarch64-apple-darwin
            suffix: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Build pkg
        shell: bash
        run: |
          mkdir -p target/distrib
          chmod +x packaging/macos/build-pkg.sh
          version="${{ needs.plan.outputs.version }}"
          packaging/macos/build-pkg.sh \
            "target/${{ matrix.target }}/release/pdf-encrypt" \
            "$version" \
            "target/distrib/pdf-encrypt-${{ matrix.suffix }}.pkg"
      - name: Generate package checksum
        shell: bash
        run: |
          cd target/distrib
          shasum -a 256 *.pkg > "pdf-encrypt-${{ matrix.suffix }}.pkg.sha256"
      - name: Upload pkg to GitHub Release
        run: gh release upload "${{ needs.plan.outputs.tag }}" target/distrib/*.pkg target/distrib/*.pkg.sha256 --clobber

  package-manager-manifests:
    name: Package manager manifests
    needs:
      - plan
      - host
    if: ${{ always() && needs.host.result == 'success' && needs.plan.outputs.publishing == 'true' }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download release checksums
        run: |
          mkdir -p target/distrib/checksums
          gh release download "${{ needs.plan.outputs.tag }}" \
            --pattern 'pdf-encrypt-x86_64-pc-windows-msvc.zip.sha256' \
            --pattern 'pdf-encrypt-aarch64-pc-windows-msvc.zip.sha256' \
            --dir target/distrib/checksums
      - name: Render Scoop manifest
        shell: bash
        run: |
          version="${{ needs.plan.outputs.version }}"
          x64_sha256=$(awk '{print $1}' target/distrib/checksums/pdf-encrypt-x86_64-pc-windows-msvc.zip.sha256)
          arm64_sha256=$(awk '{print $1}' target/distrib/checksums/pdf-encrypt-aarch64-pc-windows-msvc.zip.sha256)
          chmod +x packaging/scoop/render-manifest.sh
          packaging/scoop/render-manifest.sh \
            "$version" \
            "$x64_sha256" \
            "$arm64_sha256" \
            packaging/scoop/pdf-encrypt.json \
            target/distrib/pdf-encrypt-scoop.json
      - name: Upload package manager manifests
        run: gh release upload "${{ needs.plan.outputs.tag }}" target/distrib/pdf-encrypt-scoop.json --clobber

  publish-crates-io:
    name: Publish crates.io
    needs:
      - plan
      - host
    if: ${{ always() && needs.plan.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.verify_trusted_publishing) || (needs.host.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.plan.outputs.republish-existing != 'true')) }}
    runs-on: ubuntu-22.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Confirm Trusted Publishing authentication
        if: ${{ inputs.verify_trusted_publishing }}
        run: echo "Trusted Publishing authentication succeeded; no crate or release assets were published."
      - name: Publish crate
        if: ${{ !inputs.verify_trusted_publishing }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  announce:
    needs:
      - plan
      - host
      - linux-packages
      - macos-pkg
      - package-manager-manifests
      - publish-crates-io
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' && (needs.linux-packages.result == 'success' || needs.linux-packages.result == 'skipped') && (needs.macos-pkg.result == 'success' || needs.macos-pkg.result == 'skipped') && (needs.package-manager-manifests.result == 'success' || needs.package-manager-manifests.result == 'skipped') && (needs.publish-crates-io.result == 'success' || needs.publish-crates-io.result == 'skipped') }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
