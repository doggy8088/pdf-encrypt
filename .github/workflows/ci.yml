name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build
        run: cargo build --locked

  installers:
    name: Installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Lint install.sh
        if: runner.os == 'Linux'
        run: shellcheck install.sh npm/publish-packages.sh

      - name: Install latest release with install.sh
        if: runner.os != 'Windows'
        run: |
          sh install.sh --to "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/pdf-encrypt" --version

      - name: Install latest release with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'bin'
          ./install.ps1 -InstallDir $dir -NoModifyPath
          & (Join-Path $dir 'pdf-encrypt.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install latest release with install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'bin-ps5'
          $env:PDF_ENCRYPT_INSTALL_DIR = $dir
          $env:PDF_ENCRYPT_NO_MODIFY_PATH = '1'
          Get-Content -Raw ./install.ps1 | Invoke-Expression
          & (Join-Path $dir 'pdf-encrypt.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
